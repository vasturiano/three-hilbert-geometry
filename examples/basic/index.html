<head>
  <style> body { margin: 0; } </style>

  <script type="importmap">{ "imports": {
    "three": "https://esm.sh/three",
    "three/": "https://esm.sh/three/"
  }}</script>

<!--  <script type="module">import * as THREE from 'three'; window.THREE = THREE;</script>-->
<!--  <script src="../../dist/three-hilbert-geometry.js" defer></script>-->
</head>

<body>
<div id="viz"></div>

<script type="module">
  import HilbertGeometry from 'https://esm.sh/three-hilbert-geometry?external=three';
  import * as THREE from 'three';
  import { TrackballControls } from 'three/examples/jsm/controls/TrackballControls.js?external=three';

  const order = 3;
  const hilbertObj = new THREE.Mesh(
    new HilbertGeometry(order, 0, Math.pow(8, order), { padding: 0.6, simplifyCurves: false }),
    new THREE.MeshStandardMaterial({ map: getGradientTexture() })
  );

  function getGradientTexture() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, size);
    gradient.addColorStop(0, "green");
    gradient.addColorStop(1, "red");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    return texture;
  }

  // Setup renderer
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
  document.getElementById('viz').appendChild(renderer.domElement);

  // Setup scene
  const scene = new THREE.Scene();
  scene.add(hilbertObj);
  scene.add(new THREE.AmbientLight(0xbbbbbb, 2));
  scene.add(new THREE.DirectionalLight(0xffffff, 1));

  // Setup camera
  const camera = new THREE.PerspectiveCamera();
  camera.aspect = window.innerWidth/ window.innerHeight;
  camera.updateProjectionMatrix();
  camera.position.x = 3;
  camera.position.y = 3;
  camera.position.z = 3;

  // Add camera controls
  const tbControls = new TrackballControls(camera, renderer.domElement);
  tbControls.minDistance = 1;
  tbControls.rotateSpeed = 5;
  tbControls.zoomSpeed = 0.8;

  // Kick-off renderer
  (function animate() { // IIFE
    // Frame cycle
    tbControls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  })();
</script>
</body>
